# Copy this file into ESPHome Device Builder; no local component folders needed.
substitutions:
  gtag_name: nrf-gtag-display
  gtag_friendly_name: NRF GTag Display
  gtag_battery_calibration: "1.0"

packages:
  gtag: github://lukdut/gtag-nrf-display/config/esphome/packages/ble.yaml@v0.9.0-beta.3

# Optional GPIO overrides (physical nRF52840 pin names; defaults shown):
# gtag_display:
#   dio_pin: P0.11
#   clk_pin: P1.04
#   cs_pin: P1.06
#   reset_pin: P1.13
#   battery_voltage:
#     pin: P0.31
# If the divider is not fitted, replace battery_voltage above with:
#   battery_voltage: !remove
