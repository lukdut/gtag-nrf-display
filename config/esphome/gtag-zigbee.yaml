# Copy into ESPHome Device Builder 2026.9.0 or newer.
# Install zigbee2mqtt/gtag-display.mjs in Zigbee2MQTT before adding the screen in HA.
substitutions:
  gtag_name: nrf-gtag-zigbee
  gtag_friendly_name: GTag Zigbee Display
  gtag_battery_calibration: "1.0"

packages:
  gtag: github://lukdut/gtag-nrf-display/config/esphome/packages/zigbee.yaml@v0.9.0-beta.2

# Optional GPIO overrides (physical nRF52840 pin names; defaults shown):
# gtag_display:
#   dio_pin: P0.11
#   clk_pin: P1.04
#   cs_pin: P1.06
#   reset_pin: P1.13
#   battery_voltage:
#     pin: P0.31
# If the divider is not fitted, replace battery_voltage above with:
#   battery_voltage: !remove
