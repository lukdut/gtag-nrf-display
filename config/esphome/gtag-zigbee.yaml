# ESPHome Device Builder 2026.9.0; Pro Micro / nice!nano S140 v6 bootloader.
# Set all hardware and battery settings to match your wiring before compiling.
substitutions:
  gtag_name: nrf-gtag-zigbee
  gtag_friendly_name: GTag Zigbee Display

packages:
  gtag: github://lukdut/gtag-nrf-display/config/esphome/packages/zigbee.yaml@v1.1.1

# Explicit hardware settings: physical nRF52840 GPIO names.
gtag_display:
  dio_pin: P0.11
  clk_pin: P1.04
  cs_pin: P1.06
  reset_pin: P1.13
  # B+ -- 1M -- P0.31 -- 1M -- GND; 100nF from P0.31 to GND.
  battery_voltage:
    enabled: true
    pin: P0.31
    calibration: 1.0
    empty_voltage: 3.306V
    full_voltage: 4.19V
    recovery_voltage: 3.45V

# Without the external battery divider, replace the entire battery_voltage block
# with: {enabled: false}, and add this package AFTER gtag above:
#   no_battery: github://lukdut/gtag-nrf-display/config/esphome/packages/zigbee-no-battery.yaml@v1.1.1
# Install zigbee2mqtt/gtag-display.mjs from this release in Zigbee2MQTT.
