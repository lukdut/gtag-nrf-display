esphome:
  name: nrf-gtag-display
  friendly_name: NRF GTag Display

nrf52:
  board: adafruit_itsybitsy_nrf52840
  bootloader: adafruit_nrf52_sd140_v6
  dcdc: false
  framework:
    version: 2.9.2

logger:
  level: INFO

external_components:
  - source:
      type: local
      path: components
    components:
      - gtag_display

gtag_display:
  tx_power: 0
