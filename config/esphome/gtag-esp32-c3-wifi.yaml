# ESP32-C3 Super Mini, USB power. See docs/esp32-wifi.md for setup.
substitutions:
  gtag_name: gtag-esp32-display
  gtag_friendly_name: GTag Display Wi-Fi

packages:
  gtag: github://lukdut/gtag-nrf-display/config/esphome/packages/wifi.yaml@v1.1.1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If Wi-Fi fails with "Auth Expired", uncomment both options below,
  # rebuild and flash via USB. Lower TX power may reduce range.
  # power_save_mode: none
  # output_power: 8.5dB

api:
  encryption:
    key: !secret gtag_api_key

ota:
  - platform: esphome
    password: !secret gtag_ota_password

# Keep GTag power, GND and the original DisplayCLK/S1 clock connected.
# GPIO18/19 stay free for native USB; GPIO2/8/9 are boot strapping pins.
gtag_display:
  dio_pin: GPIO0
  clk_pin: GPIO1
  cs_pin: GPIO3
  reset_pin: GPIO4
