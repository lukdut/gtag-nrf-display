# Local development configuration. See docs/esp8266-wifi.md.
packages:
  gtag: !include packages/esp8266-wifi-base.yaml

external_components:
  - source:
      type: local
      path: components
    components: [gtag_display]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret gtag_api_key

ota:
  - platform: esphome
    password: !secret gtag_ota_password

# Keep the LCD's original power and DisplayCLK/S1 clock, and common GND.
# D2=GPIO4, D1=GPIO5, D6=GPIO12, D5=GPIO14; boot/UART pins stay free.
gtag_display:
  dio_pin: GPIO4
  clk_pin: GPIO5
  cs_pin: GPIO12
  reset_pin: GPIO14
