# Local development / compile-check configuration; supply real secrets to flash.
packages:
  gtag: !include packages/wifi-base.yaml

external_components:
  - source:
      type: local
      path: components
    components: [gtag_display]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If Wi-Fi fails with "Auth Expired", uncomment both options below,
  # rebuild and flash via USB. Lower TX power may reduce range.
  # power_save_mode: none
  # output_power: 8.5dB

api:
  encryption:
    key: !secret gtag_api_key

ota:
  - platform: esphome
    password: !secret gtag_ota_password

gtag_display:
  dio_pin: GPIO0
  clk_pin: GPIO1
  cs_pin: GPIO3
  reset_pin: GPIO4
