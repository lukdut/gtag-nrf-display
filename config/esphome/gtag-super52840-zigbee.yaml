# Super52840 with stock XIAO S140 v7 bootloader; no battery measurement.
# Copy into ESPHome Device Builder 2026.9.0.
substitutions:
  gtag_name: nrf-gtag-super52840
  gtag_friendly_name: GTag Super52840

packages:
  gtag: github://lukdut/gtag-nrf-display/config/esphome/packages/zigbee.yaml@v1.1.1
  board: github://lukdut/gtag-nrf-display/config/esphome/packages/super52840.yaml@v1.1.1
  no_battery: github://lukdut/gtag-nrf-display/config/esphome/packages/zigbee-no-battery.yaml@v1.1.1

# Explicit hardware settings; no external battery divider is fitted.
gtag_display:
  dio_pin: P1.15
  clk_pin: P1.13
  cs_pin: P1.14
  reset_pin: P1.12
  battery_voltage:
    enabled: false
