# Local development entry point; the same settings are used by the GitHub package.
packages:
  gtag: !include packages/ble-base.yaml

external_components:
  - source:
      type: local
      path: components
    components: [gtag_display]

# Enable USB logs only for diagnostics (increases standby consumption):
# logger:
#   level: INFO

# Explicit hardware settings: physical nRF52840 GPIO names.
gtag_display:
  dio_pin: P0.11
  clk_pin: P1.04
  cs_pin: P1.06
  reset_pin: P1.13
  # B+ -- 1M -- P0.31 -- 1M -- GND; 100nF from P0.31 to GND.
  battery_voltage:
    enabled: true
    pin: P0.31
    calibration: 1.0
    empty_voltage: 3.306V
    full_voltage: 4.19V
    recovery_voltage: 3.45V
