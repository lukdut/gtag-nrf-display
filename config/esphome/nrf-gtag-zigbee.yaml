# Experimental Zigbee profile, built with ESPHome 2026.9.0.
# Uses the SAME LCD/ADC component as BLE. See docs/zigbee-prototype.md.
packages:
  gtag: !include packages/zigbee-base.yaml

external_components:
  - source:
      type: local
      path: components
    components: [gtag_display]

# Optional USB diagnostics (increases power use):
# logger:
#   level: DEBUG

# Explicit hardware settings: physical nRF52840 GPIO names.
gtag_display:
  dio_pin: P0.11
  clk_pin: P1.04
  cs_pin: P1.06
  reset_pin: P1.13
  # B+ -- 1M -- P0.31 -- 1M -- GND; 100nF from P0.31 to GND.
  battery_voltage:
    enabled: true
    pin: P0.31
    calibration: 1.0
    empty_voltage: 3.306V
    full_voltage: 4.19V
    recovery_voltage: 3.45V
