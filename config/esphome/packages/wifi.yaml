# USB-powered ESP32-C3 profile, pinned to the matching component release.
packages:
  gtag_base: !include wifi-base.yaml

external_components:
  - source:
      type: git
      url: https://github.com/lukdut/gtag-nrf-display.git
      ref: v1.1.1
      path: config/esphome/components
    refresh: never
    components: [gtag_display]
