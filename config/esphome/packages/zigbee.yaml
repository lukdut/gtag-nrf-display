# Public Zigbee package. Pin the package and its C++ component to the same release.
packages:
  gtag_base: !include zigbee-base.yaml

external_components:
  - source:
      type: git
      url: https://github.com/lukdut/gtag-nrf-display.git
      ref: v1.0.1
      path: config/esphome/components
    refresh: never
    components: [gtag_display]
