
  
esphome:
  name: nrf-gtag-display
  friendly_name: NRF GTag Display
  min_version: 2026.8.2
  on_boot:
    priority: -100
    then:
      - lambda: App.set_loop_interval(1000);

gtag_display:
  transport: ble
  tx_power: "0"
  advertising_interval: 1s
  boot_test_pattern: logo
  dio_pin: P0.11
  clk_pin: P1.04
  cs_pin: P1.06
  reset_pin: P1.13
  battery_voltage:
    enabled: false
  button_pin: P0.17

    
external_components:
  - source:
      type: local
      path: components
    components: [gtag_display]

nrf52:
  board: adafruit_itsybitsy_nrf52840
  bootloader: adafruit_nrf52_sd140_v6
  dcdc: false
  framework:
    version: 2.9.2    

logger:
      
binary_sensor:
  - platform: gpio
    pin:
      number: P0.17
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Physical Button"
    id: physical_button
    filters:
      - delayed_on: 10ms