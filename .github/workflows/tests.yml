name: Tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  esphome-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install esphome==2026.9.0
      - name: Public YAML, documentation, GPIO validation and code generation
        run: python -m unittest discover -s tests/esphome -v
  wifi-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        board: [esp32c3_supermini, d1_mini]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install esphome==2026.9.0
      - uses: actions/cache@v4
        if: matrix.board == 'esp32c3_supermini'
        with:
          path: ~/.cache/esphome/idf
          key: idf-${{ runner.os }}-${{ runner.arch }}-5.5.5-esphome-2026.9.0
      - name: Compile Wi-Fi display, encrypted API and OTA
        env:
          GTAG_BOARD: ${{ matrix.board }}
        run: python tests/container/build_wifi.py --board "$GTAG_BOARD" --build-dir /tmp/gtag-wifi-build
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements-ha.txt
      - run: python -m pip install -r tests/requirements-ha.txt
      - name: Home Assistant integration
        run: python -m pytest tests/ha
      - name: Firmware protocol and sender
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            tests/zigbee/package-lock.json
            tests/frontend/package-lock.json
      - run: npm ci --prefix tests/frontend --ignore-scripts --no-audit --no-fund
      - name: HA translations and download link rendering
        run: npm test --prefix tests/frontend
      - run: npm ci --prefix tests/zigbee --ignore-scripts --no-audit --no-fund
      - name: Zigbee converter and firmware interoperability
        run: npm test --prefix tests/zigbee
      - name: Build installation archive
        run: python scripts/package.py
      - name: Check release metadata
        run: python scripts/check_release.py
