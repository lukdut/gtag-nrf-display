name: Tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements-ha.txt
      - run: python -m pip install -r tests/requirements-ha.txt
      - name: Home Assistant integration
        run: python -m pytest tests/ha
      - name: Firmware protocol and sender
        run: python -m unittest discover -s tests -v
      - name: Build installation archive
        run: python scripts/package.py
