name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  firmware:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      ESPHOME_SDK_NRF_PREFIX: ${{ github.workspace }}/.nrf-sdk
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify release version
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path("custom_components/gtag_ble_test/manifest.json").read_text())["version"]
          tag = f"v{version}"
          assert os.environ["RELEASE_REF"] == tag, "Run this workflow on the release tag"
          assert Path(f"docs/releases/{version}.md").is_file()
          assert f"ref: {tag}" in Path("config/esphome/packages/ble.yaml").read_text()
          assert f"@{tag}" in Path("config/esphome/gtag-ble.yaml").read_text()
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/release.yml
      - run: python -m pip install esphome==2026.8.2
      - uses: actions/cache@v4
        with:
          path: .nrf-sdk
          key: nrf-sdk-${{ runner.os }}-${{ runner.arch }}-2.9.2-esphome-2026.8.2
      - name: Build the public ESPHome configuration
        run: esphome compile config/esphome/gtag-ble.yaml
      - name: Package artifacts
        run: |
          mkdir -p dist
          cp config/esphome/.esphome/build/nrf-gtag-display/.pioenvs/nrf-gtag-display/zephyr/zephyr.uf2 dist/gtag-display.uf2
          python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtag-release
          path: |
            dist/gtag-display.uf2
            dist/gtag-ha-integration.zip
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_REF" \
            dist/gtag-display.uf2 dist/gtag-ha-integration.zip dist/SHA256SUMS \
            --verify-tag --title "GTag Display $RELEASE_REF" \
            --notes-file "docs/releases/${RELEASE_REF#v}.md"
