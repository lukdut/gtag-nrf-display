name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  compatibility:
    uses: ./.github/workflows/compatibility.yml
  firmware:
    needs: [tests, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: ble
            board: promicro
            config: gtag-ble
            device: nrf-gtag-display
          - profile: zigbee
            board: promicro
            config: gtag-zigbee
            device: nrf-gtag-zigbee
          - profile: zigbee
            board: super52840
            config: gtag-super52840-zigbee
            device: nrf-gtag-super52840
    env:
      ESPHOME_SDK_NRF_PREFIX: ${{ github.workspace }}/.nrf-sdk
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify release version
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: python3 scripts/check_release.py --tag "$RELEASE_REF"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/release.yml
      - run: python -m pip install esphome==2026.9.0
      - uses: actions/cache@v4
        with:
          path: .nrf-sdk
          key: nrf-sdk-${{ runner.os }}-${{ runner.arch }}-2.9.2-esphome-2026.9.0
      - name: Build the public ESPHome configuration
        env:
          CONFIG: ${{ matrix.config }}
        run: esphome compile "config/esphome/$CONFIG.yaml"
      - name: Package firmware and ESPHome sources
        env:
          PROFILE: ${{ matrix.profile }}
          BOARD: ${{ matrix.board }}
          DEVICE: ${{ matrix.device }}
        run: |
          python scripts/package_firmware.py --profile "$PROFILE" --board "$BOARD" \
            --uf2 "config/esphome/.esphome/build/$DEVICE/.pioenvs/$DEVICE/zephyr/zephyr.uf2"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}-${{ matrix.profile }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true
      - name: Package integration and checksums
        run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtag-release
          path: dist/*
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          release_args=()
          if [[ "$RELEASE_REF" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_REF" dist/* \
            --verify-tag --title "GTag Display $RELEASE_REF" \
            --notes-file "docs/releases/${RELEASE_REF#v}.md" "${release_args[@]}"
